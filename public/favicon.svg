<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
	  Redraw of the owner's avatar: a Tachikoma-inspired head, i.e. a white
	  sphere standing out of a blue body, three eyes facing the viewer. Built
	  from that model, so the shape is deliberate and not to be "corrected":
	  the top arc is a TRUE semicircle (equal radii, the sphere's silhouette)
	  while the base is the mounting ring in perspective (27.52 by 18.88). The
	  eyes sit on the sphere's projected centre, on an equilateral triangle.
	  Eyes are 2x the source avatar's, which vanish under one pixel at 16px.

	  NEVER write a double hyphen in this comment. XML forbids it inside one,
	  and an invalid favicon fails silently. Use "=" or a colon.

	  Derived files, both rendered headless from THIS file (see git log for the
	  full derivation and the alternatives that were rejected):
	    favicon.ico          frames at 16 and 32.
	    apple-touch-icon.png 180x180, with rx REMOVED. It must stay an opaque
	                         square: iOS applies its own mask, so a pre-rounded
	                         icon is cut twice and leaks wallpaper at the corners.
	-->
	<rect width="64" height="64" rx="14" fill="#0073C0"/>
	<path d="M4.48 36.32A27.52 27.52 0 0 1 59.52 36.32A27.52 18.88 0 0 1 4.48 36.32Z" fill="#FFFFFF"/>
	<g fill="#000000">
		<circle cx="32" cy="29.53" r="3.36"/>
		<circle cx="26.12" cy="39.715" r="3.36"/>
		<circle cx="37.88" cy="39.715" r="3.36"/>
	</g>
</svg>
